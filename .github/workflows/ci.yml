name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.26.1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.golang-app }}
      app2: ${{ steps.filter.outputs.golang-app2 }}
      commons: ${{ steps.filter.outputs.golang-commons }}
      events: ${{ steps.filter.outputs.golang-events }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            golang-app:
              - 'golang-app/**'
              - 'golang-commons/**'
              - 'golang-events/**'
            golang-app2:
              - 'golang-app2/**'
              - 'golang-commons/**'
              - 'golang-events/**'
            golang-commons:
              - 'golang-commons/**'
            golang-events:
              - 'golang-events/**'
            chart:
              - 'golang-system-chart/**'

  lint:
    needs: changes
    if: |
      needs.changes.outputs.app == 'true' || needs.changes.outputs.app2 == 'true' ||
      needs.changes.outputs.commons == 'true' || needs.changes.outputs.events == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [golang-commons, golang-events, golang-app, golang-app2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}
          version: v2.12.2

  test:
    needs: changes
    if: |
      needs.changes.outputs.app == 'true' || needs.changes.outputs.app2 == 'true' ||
      needs.changes.outputs.commons == 'true' || needs.changes.outputs.events == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [golang-commons, golang-events, golang-app, golang-app2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 5
      postgres2:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app2_db
          POSTGRES_USER: app2_user
          POSTGRES_PASSWORD: app2_password
        ports: [5433:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports: [4222:4222]
        options: --health-cmd "nats-server --signal ldm=0" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        if: matrix.module == 'golang-app' || matrix.module == 'golang-app2'
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out
      - name: Upload coverage to Codecov
        if: matrix.module == 'golang-app' || matrix.module == 'golang-app2'
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          name: coverage-${{ matrix.module }}
          fail_ci_if_error: false

  build:
    needs: [changes, test]
    if: |
      needs.changes.outputs.app == 'true' || needs.changes.outputs.app2 == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [golang-app, golang-app2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - working-directory: ${{ matrix.module }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.module }}
          path: ${{ matrix.module }}/server

  helm:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: v3.15.0
      - name: helm lint / template
        run: |
          helm lint golang-system-chart
          helm template golang-system golang-system-chart > /tmp/rendered.yaml
          grep -q 'name: golang-app' /tmp/rendered.yaml
          grep -q '/admin/health/liveness' /tmp/rendered.yaml
          grep -q 'name: APP_PORT' /tmp/rendered.yaml

  docker:
    needs: [changes, build]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.app2 == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [golang-app, golang-app2]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository }}/${{ matrix.service }}"
          TAGS="${REPO}:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${REPO}:latest"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TAGS="${TAGS},${REPO}:develop"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
