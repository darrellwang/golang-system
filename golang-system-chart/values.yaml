global:
  environment: dev
  imageRegistry: ghcr.io

golangApp:
  image:
    repository: golang-app
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  version: v1
  service:
    # ClusterIP port matches app listen port for in-mesh DNS (golang-app:8080).
    port: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  config:
    appPort: 8080
    appMode: PROD
    logLevel: info
    # Align with docker-compose local defaults for consistency.
    dbHost: postgres-app
    dbPort: 5432
    dbName: app_db
    dbUser: app_user
    dbSslmode: disable
    natsUrl: nats://nats:4222
    queueGroup: golang-app-queue
    corsAllowedOrigins: "https://app.example.com"
    # Behind Istio JWT gateway: do not trust client X-User-ID; require claim headers.
    authTrustHeaders: false
    authRequireJwt: true

golangApp2:
  image:
    repository: golang-app2
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  version: v1
  service:
    port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  config:
    appPort: 8081
    appMode: PROD
    logLevel: info
    dbHost: postgres-app2
    dbPort: 5432
    dbName: app2_db
    dbUser: app2_user
    dbSslmode: disable
    natsUrl: nats://nats:4222
    queueGroup: golang-app2-queue
    itemServiceUrl: http://golang-app:8080
    corsAllowedOrigins: "https://app.example.com"
    authTrustHeaders: false
    authRequireJwt: true

postgresApp:
  enabled: true
  image: postgres:16-alpine
  port: 5432
  db: app_db
  user: app_user
  # Override via --set or Secret; do not commit real production passwords.
  password: change-me
  persistence:
    enabled: true
    size: 8Gi

postgresApp2:
  enabled: true
  image: postgres:16-alpine
  port: 5432
  db: app2_db
  user: app2_user
  password: change-me
  persistence:
    enabled: true
    size: 8Gi

nats:
  image: nats:2.10-alpine
  clientPort: 4222
  monitorPort: 8222
  persistence:
    enabled: true
    size: 5Gi

# Prefer Istio Gateway for ingress; keep nginx Ingress disabled.
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /rest/v1/items
          service: golang-app
          port: 8080
        - path: /rest/v1/orders
          service: golang-app2
          port: 8081
  tls: []

networkPolicy:
  enabled: false
