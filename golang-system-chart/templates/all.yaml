            - containerPort: {{ .Values.golangApp2.service.port }}
          env:
            - name: SERVER_PORT
              value: "{{ .Values.golangApp2.service.port }}"
            - name: APP_DB_DSN
              value: "postgres://{{ .Values.golangApp2.db.user }}:{{ .Values.golangApp2.db.password }}@{{ .Values.golangApp2.db.host }}:{{ .Values.golangApp2.db.port }}/{{ .Values.golangApp2.db.name }}?sslmode=disable"
