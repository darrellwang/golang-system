{{- /* Shared DB secrets (override passwords via --set / sealed-secrets / external-secrets). */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: golang-app-db
  labels:
    app: golang-app
    release: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgresApp.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: golang-app2-db
  labels:
    app: golang-app2
    release: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgresApp2.password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-app
  labels:
    app: golang-app
    version: {{ .Values.golangApp.version }}
    release: {{ .Release.Name }}
spec:
  {{- if not .Values.golangApp.autoscaling.enabled }}
  replicas: {{ .Values.golangApp.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: golang-app
  template:
    metadata:
      labels:
        app: golang-app
        version: {{ .Values.golangApp.version }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: golang-app
          image: "{{ .Values.golangApp.image.repository }}:{{ .Values.golangApp.image.tag }}"
          imagePullPolicy: {{ .Values.golangApp.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.golangApp.config.appPort }}
          env:
            - name: APP_PORT
              value: {{ .Values.golangApp.config.appPort | quote }}
            - name: APP_MODE
              value: {{ .Values.golangApp.config.appMode | quote }}
            - name: APP_NAME
              value: "golang-app"
            - name: LOG_LEVEL
              value: {{ .Values.golangApp.config.logLevel | quote }}
            - name: DB_HOST
              value: {{ .Values.golangApp.config.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.golangApp.config.dbPort | quote }}
            - name: DB_NAME
              value: {{ .Values.golangApp.config.dbName | quote }}
            - name: DB_USER
              value: {{ .Values.golangApp.config.dbUser | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.golangApp.config.dbSslmode | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golang-app-db
                  key: DB_PASSWORD
            - name: NATS_URL
              value: {{ .Values.golangApp.config.natsUrl | quote }}
            - name: QUEUE_GROUP
              value: {{ .Values.golangApp.config.queueGroup | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.golangApp.config.corsAllowedOrigins | quote }}
          livenessProbe:
            httpGet:
              path: /admin/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /admin/health/readiness
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.golangApp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: golang-app
  labels:
    app: golang-app
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.golangApp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: golang-app
{{- if .Values.golangApp.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: golang-app
  labels:
    app: golang-app
    release: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: golang-app
  minReplicas: {{ .Values.golangApp.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.golangApp.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.golangApp.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
