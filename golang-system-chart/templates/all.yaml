    app: postgres-app
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-app
  template:
    metadata:
      labels:
        app: postgres-app
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgresApp.image }}"
          ports:
            - containerPort: {{ .Values.postgresApp.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresApp.db | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresApp.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresApp.password | quote }}

---
