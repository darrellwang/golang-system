{{- if .Values.postgresApp.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-app-data
  labels:
    app: postgres-app
    release: {{ .Release.Name }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgresApp.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-app
  labels:
    app: postgres-app
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-app
  template:
    metadata:
      labels:
        app: postgres-app
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgresApp.image }}"
          ports:
            - containerPort: {{ .Values.postgresApp.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresApp.db | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresApp.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golang-app-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-app
  labels:
    app: postgres-app
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app: postgres-app
{{- end }}
{{- if .Values.postgresApp2.enabled }}
---
