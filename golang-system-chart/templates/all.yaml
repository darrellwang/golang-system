---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    app: nats
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: "{{ .Values.nats.image }}"
          args: ["-js"]
          ports:
            - containerPort: {{ .Values.nats.port }}
              name: client
            - containerPort: {{ .Values.nats.monitorPort }}
              name: monitor

---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app: nats
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 4222
      targetPort: 4222
      protocol: TCP
      name: client
    - port: 8222
      targetPort: 8222
      protocol: TCP
      name: monitor
  selector:
    app: nats
