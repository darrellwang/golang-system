kind: HorizontalPodAutoscaler
metadata:
  name: golang-app2
  labels:
    app: golang-app2
    release: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: golang-app2
  minReplicas: {{ .Values.golangApp2.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.golangApp2.autoscaling.maxReplicas }}
  metrics:
