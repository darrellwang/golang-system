apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: golang-app
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: golang-app
  template:
    metadata:
      labels:
        app: golang-app
    spec:
      containers:
        - name: golang-app
          image: "{{ .Values.golangApp.image.repository }}:{{ .Values.golangApp.image.tag }}"
          imagePullPolicy: {{ .Values.golangApp.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.golangApp.service.port }}
          env:
            - name: SERVER_PORT
              value: "{{ .Values.golangApp.service.port }}"
            - name: APP_DB_DSN
              value: "postgres://{{ .Values.golangApp.db.user }}:{{ .Values.golangApp.db.password }}@{{ .Values.golangApp.db.host }}:{{ .Values.golangApp.db.port }}/{{ .Values.golangApp.db.name }}?sslmode=disable"
            - name: NATS_URL
              value: {{ .Values.golangApp.nats.url | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.golangApp.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.golangApp.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: golang-app
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.golangApp.service.port }}
      targetPort: {{ .Values.golangApp.service.port }}
      protocol: TCP
      name: http
  selector:
    app: golang-app

---
