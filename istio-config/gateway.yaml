#     tls:
#       mode: ISTIO_MUTUAL  # 使用 Istio 自动 mTLS

---
# ============================================
# TLS 证书配置
# ============================================

---
# 方式 1: 使用 cert-manager 自动签发证书 (推荐)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: golang-system-tls
  namespace: default
spec:
  secretName: golang-system-tls  # 与 Gateway 中的 credentialName 对应
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "api.example.com"
  - "*.example.com"
  - "localhost"
  usages:
  - digital signature
  - key encipherment

---
# ClusterIssuer (Let's Encrypt 生产环境)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com  # 替换为你的邮箱
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    # HTTP-01 挑战 (需要 Ingress)
    - http01:
        ingress:
          class: istio
    # DNS-01 挑战 (推荐, 支持通配符)
    # - dns01:
    #     cloudflare:
    #       email: admin@example.com
    #       apiTokenSecretRef:
    #         name: cloudflare-api-token
    #         key: api-token

---
# ClusterIssuer (Let's Encrypt 测试环境, 用于测试)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          class: istio

---
# 方式 2: 手动创建 TLS Secret (测试用)
# 运行以下命令:
# 
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout tls.key -out tls.crt \
#   -subj "/CN=api.example.com/O=Golang System"
# 
# kubectl create secret tls golang-system-tls \
#   --cert=tls.crt \
#   --key=tls.key \
#   -n default

