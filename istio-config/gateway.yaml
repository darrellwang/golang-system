# ============================================
# API 网关配置 - Gateway
# 定义 Ingress Gateway 的监听器和 TLS 配置
# ============================================

---
# Golang System API Gateway
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: golang-system-gateway
  namespace: default
  labels:
    app: golang-system
    component: api-gateway
spec:
  # 选择 Ingress Gateway
  selector:
    istio: ingressgateway
  
  # 服务器配置
  servers:
  # ============================================
  # HTTP 服务器 (自动跳转 HTTPS)
  # ============================================
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "api.example.com"
    - "*.example.com"
    - "localhost"
    tls:
      httpsRedirect: true  # 强制跳转 HTTPS
  
  # ============================================
  # HTTPS 服务器 (主)
  # ============================================
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "api.example.com"
    - "*.example.com"
    - "localhost"
    tls:
      mode: SIMPLE  # 单向 TLS (也可以配置 MUTUAL 双向 TLS)
      credentialName: golang-system-tls  # Kubernetes Secret 名称
      # 如果是双向 TLS (mTLS), 使用以下配置:
      # mode: MUTUAL
      # credentialName: golang-system-mtls
      # subjectAltNames:
      # - "client.example.com"
  
  # ============================================
  # HTTPS 服务器 (内部服务, 可选)
  # ============================================
  # - port:
  #     number: 8443
  #     name: https-internal
  #     protocol: HTTPS
  #   hosts:
  #   - "internal-api.example.com"
  #   tls:
  #     mode: MUTUAL
  #     credentialName: internal-api-mtls
  
  # ============================================
  # TCP 服务器 (NATS, 可选)
  # ============================================
  # - port:
  #     number: 4222
  #     name: tcp-nats
  #     protocol: TCP
  #   hosts:
  #   - "*"

---
# ============================================
# 内部 API Gateway (可选)
# 用于内部服务间通信
# ============================================
---
