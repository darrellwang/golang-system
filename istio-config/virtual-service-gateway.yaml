# ============================================
# API 网关路由配置 - VirtualService
# 定义流量路由规则、CORS、超时、重试等
# ============================================

---
# Golang System API 路由规则
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: golang-system-routes
  namespace: default
  labels:
    app: golang-system
    component: api-gateway
spec:
  # 绑定的主机名 (与 Gateway 配置匹配)
  hosts:
  - "api.example.com"
  - "*.example.com"
  - "localhost"
  
  # 绑定的 Gateway
  gateways:
  - golang-system-gateway  # 与 Gateway 元数据名称对应
  # - mesh                 # 如果需要内部服务也走这些规则, 取消注释
  
  # HTTP 路由规则
  # Retries only on idempotent GET; write methods have timeout but no retries.
  http:
  - name: "items-get-route"
    match:
    - uri:
        prefix: /rest/v1/items
      method:
        exact: GET
    route:
    - destination:
        host: golang-app
        port:
          number: 8080
        subset: v1
      weight: 100
    corsPolicy:
      allowOrigins:
      - regex: "https://.*\\.example\\.com"
      - exact: "http://localhost:3000"
      allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
      allowHeaders:
      - Content-Type
      - Authorization
      - X-Request-ID
      - X-Organization-ID
      - X-User-ID
      - Accept
      - Origin
      allowCredentials: true
      maxAge: 24h
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: "5xx,connect-failure,refused-stream,gateway-error,reset,envoy-ratelimited"
    headers:
      response:
        set:
          x-service: "golang-app"

  - name: "items-write-route"
    match:
    - uri:
        prefix: /rest/v1/items
    route:
    - destination:
        host: golang-app
        port:
          number: 8080
        subset: v1
      weight: 100
    corsPolicy:
      allowOrigins:
      - regex: "https://.*\\.example\\.com"
      - exact: "http://localhost:3000"
      allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
      allowHeaders:
      - Content-Type
      - Authorization
      - X-Request-ID
      - X-Organization-ID
      - X-User-ID
      - Accept
      - Origin
      allowCredentials: true
      maxAge: 24h
    timeout: 30s
    retries:
      attempts: 0
    headers:
      response:
        set:
          x-service: "golang-app"

  - name: "orders-get-route"
    match:
    - uri:
        prefix: /rest/v1/orders
      method:
        exact: GET
    route:
    - destination:
        host: golang-app2
        port:
          number: 8081
        subset: v1
      weight: 100
    corsPolicy:
      allowOrigins:
      - regex: "https://.*\\.example\\.com"
      - exact: "http://localhost:3000"
      allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowHeaders:
      - Content-Type
      - Authorization
      - X-Request-ID
      - X-Organization-ID
      - X-User-ID
      allowCredentials: true
      maxAge: 24h
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: "5xx,connect-failure,refused-stream,gateway-error,reset,envoy-ratelimited"
    headers:
      response:
        set:
          x-service: "golang-app2"

  - name: "orders-write-route"
    match:
    - uri:
        prefix: /rest/v1/orders
    route:
    - destination:
        host: golang-app2
        port:
          number: 8081
        subset: v1
      weight: 100
    corsPolicy:
      allowOrigins:
      - regex: "https://.*\\.example\\.com"
      - exact: "http://localhost:3000"
      allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowHeaders:
      - Content-Type
      - Authorization
      - X-Request-ID
      - X-Organization-ID
      - X-User-ID
      allowCredentials: true
      maxAge: 24h
    timeout: 30s
    retries:
      attempts: 0
    headers:
      response:
        set:
          x-service: "golang-app2"
  
  # ============================================
  # 路由 3: 健康检查 (允许直接访问)
  # ============================================
  - name: "health-check-route"
    match:
    - uri:
        prefix: /admin/health
    - uri:
        prefix: /health
    
    route:
    - destination:
        host: golang-app
        port:
          number: 8080
    
    # 健康检查不重试
    retries:
      attempts: 0
    
    # 短超时
    timeout: 5s
  
  # ============================================
  # 路由 4: 静态文件 (可选)
  # ============================================
  # - name: "static-files-route"
  #   match:
  #   - uri:
  #       prefix: /static
  #   route:
  #   - destination:
  #       host: static-files-service
  #       port:
  #         number: 80
  
  # ============================================
  # 路由 5: API 文档 (Swagger, 可选)
  # ============================================
  - name: "api-docs-route"
    match:
    - uri:
        prefix: /api-docs
    - uri:
        prefix: /swagger
    route:
    - destination:
        host: golang-app
        port:
          number: 8080
    corsPolicy:
      allowOrigins:
      - "*"
      allowMethods:
      - GET
      - OPTIONS
      allowHeaders:
      - "*"
  
  # ============================================
  # 默认路由 (404)
  # ============================================
  - name: "default-route"
    route:
    - destination:
        host: golang-app
        port:
          number: 8080
    
    # 返回 404 (通过 Fault Injection)
    fault:
      abort:
        percentage:
          value: 100
        httpStatus: 404
    
    # 或者转发到一个默认服务
    # route:
    # - destination:
    #     host: default-backend
    #     port:
    #       number: 8080
    
    corsPolicy:
      allowOrigins:
      - "*"
      allowMethods:
      - GET
      - POST
      - OPTIONS
      allowHeaders:
      - "*"

---
# ============================================
# 内部服务路由 (可选)
# 用于服务间通信
