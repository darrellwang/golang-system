replicaCount: 2
image:
  repository: golang-app2
  tag: latest
  pullPolicy: Always
service:
  port: 80
config:
  appPort: 8081
  logLevel: info
  dbHost: postgres-app2
  dbPort: 5432
  dbName: golang-app2
  dbUser: app2
  dbSslmode: disable
  natsUrl: nats://nats:4222
  queueGroup: golang-app2-queue
  itemServiceUrl: http://golang-app:8080
